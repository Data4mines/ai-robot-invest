<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Machines - AI Robot Invest</title>
    <link rel="stylesheet" href="/static/style.css">
    <style>
        * { box-sizing: border-box; }
        body {
            background: #000;
            color: white;
            font-family: Arial, sans-serif;
            margin: 0;
            padding: 15px;
            font-size: 16px;
        }
        .container {
            max-width: 1200px;
            margin: 0 auto;
        }
        /* THIS MAKES MACHINES NOT SQUEEZED */
        .machines-grid {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(280px, 1fr));
            gap: 15px;
        }
        .machine-card {
            background: #111;
            border: 1px solid #333;
            border-radius: 10px;
            padding: 15px;
        }
        .machine-card img {
            width: 100%;
            height: auto;
            border-radius: 8px;
        }
        /* IF YOU USE A TABLE */
        .table-wrapper {
            overflow-x: auto; /* allows sideways scroll instead of squeeze */
        }
        table {
            width: 100%;
            border-collapse: collapse;
            min-width: 600px; /* prevents crushing */
        }
        td, th {
            padding: 10px;
            border: 1px solid #333;
            text-align: left;
        }
    </style>
</head>
<body>
    <div class="container">
        <h1>Our Machines</h1>

        <!-- OPTION A: USE CARDS - RECOMMENDED FOR PHONE -->
        <div class="machines-grid">
            <div class="machine-card">
                <img src="/static/machine1.jpg" alt="Machine 1">
                <h3>Machine Name</h3>
                <p>Price: $100</p>
                <p>Daily Profit: $5</p>
            </div>
            <!-- duplicate this card for each machine -->
        </div>

        <!-- OPTION B: IF YOU MUST USE A TABLE -->
        <!--
        <div class="table-wrapper">
            <table>
                <tr><th>Machine</th><th>Price</th><th>Profit</th></tr>
                <tr><td>Machine 1</td><td>$100</td><td>$5</td></tr>
            </table>
        </div>
        -->

    </div>
</body>
</html>
