<!DOCTYPE html>
<html lang="en">
<head>
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>DATA 4MINES</title>
<style>
body {
    background: #000;
    color: white;
    font-family: Arial, sans-serif;
    margin: 0;
    padding: 0;
}

/* HEADER */
.header {
    background: linear-gradient(90deg, #FFD700, #FFA500);
    color: #000;
    text-align: center;
    padding: 15px;
    font-size: 28px;
    font-weight: bold;
}

/* MENU */
.menu {
    background: #111;
    display: flex;
    flex-wrap: wrap;
    justify-content: center;
    gap: 15px;
    padding: 12px;
}
.menu a {
    color: #FFD700;
    text-decoration: none;
    font-size: 14px;
    font-weight: bold;

    Line 16 .header { ... }
Line 23 }
Line 25 /* MENU */
Line 26 .menu {
Line 27   background: #111;
Line 28   display: flex;
Line 29 }  <-- ENDS HERE
}
.menu a:hover { color: white; }

/* MACHINE CARDS WITH SPACE */
.machine-container {
    display: flex;
    flex-wrap: wrap;
    gap: 20px; /* SPACE BETWEEN MACHINES */
    justify-content: center;
    padding: 20px;
}

.machine-card {
    background: #1a1a1a;
    border: 2px solid #FFD700;
    border-radius: 12px;
    padding: 20px;
    width: 300px;
    text-align: center;
    box-shadow: 0 0 10px #FFD700;
}

.machine-card img {
    width: 100%;
    border-radius: 8px;
}

.price { color: #00FF00; font-size: 22px; font-weight: bold; }
.profit { color: #FFD700; font-size: 20px; font-weight: bold; }
.total { color: #00FFFF; font-size: 20px; font-weight: bold; }

/* PHONE VIEW */
@media (max-width: 768px) {
    .machine-card {
        width: 90%; /* 1 per row on phone */
        margin: 10px auto;
    }
    .price { font-size: 26px; }
    .profit { font-size: 24px; }
    .total { font-size: 24px; }
    body { font-size: 16px; }
}
}

.machine-card {
    background: #1a1a1a;
    border: 2px solid #FFD700;
    border-radius: 12px;
    padding: 20px;
    width: 300px; /* Desktop: 3-4 across */
    text-align: center;
    box-shadow: 0 0 10px #FFD700;
    transition: transform 0.2s;
}
.machine-card:hover {
    transform: scale(1.05);
}

.machine-card img {
    width: 100%;
    border-radius: 8px;
    margin-bottom: 10px;
}

.price { color: #00FF00; font-size: 22px; font-weight: bold; }
.profit { color: #FFD700; font-size: 20px; font-weight: bold; }
.total { color: #00FFFF; font-size: 20px; font-weight: bold; }

.buy-btn {
    background: #FFD700;
    color: #000;
    border: none;
    padding: 10px 20px;
    border-radius: 8px;
    font-weight: bold;
    cursor: pointer;
    margin-top: 10px;
}
.buy-btn:hover { background: #FFA500; }

/* PHONE VIEW: stack 1 per row and make text BIG */
@media (max-width: 768px) {
    .header { font-size: 24px; }
    .menu a { font-size: 12px; }
    .machine-card {
        width: 90%; /* 1 per row on phone */
        margin: 10px auto;
        font-size: 16px;
    }
    .price { font-size: 26px; }
    .profit { font-size: 24px; }
    .total { font-size: 24px; }
}
</style>
</head>
